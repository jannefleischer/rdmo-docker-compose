---
version: '3'

# Task is an optional convenience layer; the stack also runs with plain
# "docker compose" (docker-compose.yaml ships sensible defaults for every
# variable). Load configuration: values from the (optional, git-ignored)
# ".env" take precedence over the tracked defaults in ".env.defaults".
dotenv: ['.env', '.env.defaults']

env:
  LOCAL_UID:
    sh: |
      uid=$(id -u)
      if [ "${uid}" = "0" ]; then echo 1000; else echo "${uid}"; fi
  LOCAL_GID:
    sh: |
      gid=$(id -g)
      if [ "${gid}" = "0" ]; then echo 1000; else echo "${gid}"; fi

vars:
  COMPOSE_FILES: '-f docker-compose.yaml{{if .POSTGRES_EXPOSED_PORT}} -f docker-compose.postgres-port.yaml{{end}}'
  COMPOSE: 'docker compose -p "{{.GLOBAL_PREFIX | default "rdc"}}" {{.COMPOSE_FILES}}'

tasks:
  default:
    desc: build and run the stack
    cmds:
      - task: build
      - task: run

  build:
    desc: build the images, relying on normal docker layer caching
    cmds:
      - '{{.COMPOSE}} build'

  build-fresh:
    desc: rebuild the images from scratch, ignoring the cache and pulling fresh base images
    cmds:
      - '{{.COMPOSE}} build --no-cache --pull'

  run:
    desc: start the stack in the background
    cmds:
      - '{{.COMPOSE}} up -d'

  restart:
    desc: restart all containers
    cmds:
      - '{{.COMPOSE}} restart'

  rebuild:
    desc: stop and remove the stack, then build and start it again
    cmds:
      - task: rm
      - task: build
      - task: run

  rm:
    desc: stop and remove the containers, networks and images of this stack
    cmds:
      - '{{.COMPOSE}} down --rmi all --remove-orphans'

  ls:
    desc: list images and containers belonging to this stack
    cmds:
      - '{{.COMPOSE}} images'
      - '{{.COMPOSE}} ps'

  logs:
    desc: tail logs of all containers
    cmds:
      - '{{.COMPOSE}} logs -f'

  sh:
    desc: open a shell inside the rdmo container
    cmds:
      - 'docker exec -it "{{.GLOBAL_PREFIX | default "rdc"}}-rdmo" /bin/bash'

  bkp:
    desc: make a backup of the vol folder
    cmds:
      - sh/make_vol_backup.sh

  config:
    desc: render and validate the fully interpolated compose configuration
    cmds:
      - '{{.COMPOSE}} config --quiet'
