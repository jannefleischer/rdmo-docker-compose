---
name: build

on:
  schedule:
    - cron: "0 7 * * 1,4"
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tags:
        description: 'manual build test'

jobs:
  build-task:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Validate compose configuration
        run: task config
      - name: Build images
        run: task build

  # Builds via plain docker compose only, no Task involved, to prove Task is
  # genuinely optional and not silently required for the stack to work.
  build-plain-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose -f docker-compose.yaml config --quiet
      - name: Build images
        run: docker compose -f docker-compose.yaml build
