---
stages:
  - deploy
  - push

# The smoke-test curls use "Host: localhost" because the request otherwise
# arrives with Host "docker" (the dind service alias), which isn't in
# ALLOWED_HOSTS and Django would reject with a 400.
.deploy-smoke-test-base:
  stage: deploy
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# Deploys via Task.
deploy-smoke-test-task:
  extends: .deploy-smoke-test-base
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin
  script:
    - task config
    - task build
    - task run
    - 'curl --fail --retry 5 --retry-connrefused --retry-delay 3 -H "Host: localhost" http://docker:8484/'
    - task logs-once
  after_script:
    - task rm

# Deploys via plain docker compose only, no Task involved, to prove Task is
# genuinely optional and not silently required for the stack to work. Also
# the canonical build: saves the built images as an artifact so push-images
# (below) doesn't need to build a third time.
deploy-smoke-test-plain-compose:
  extends: .deploy-smoke-test-base
  before_script:
    - apk add --no-cache curl
  script:
    - docker compose -p rdmo -f docker-compose.yaml config --quiet
    - docker compose -p rdmo -f docker-compose.yaml build
    - docker compose -p rdmo -f docker-compose.yaml up -d
    - 'curl --fail --retry 5 --retry-connrefused --retry-delay 3 -H "Host: localhost" http://docker:8484/'
    - docker compose -p rdmo -f docker-compose.yaml logs --no-color
    - docker save rdmo-caddy rdmo-postgres rdmo-rdmo -o images.tar
  after_script:
    - docker compose -p rdmo -f docker-compose.yaml down --rmi all --remove-orphans
  artifacts:
    paths:
      - images.tar
    expire_in: 1 hour

# Loads the images built (and already smoke-tested) by
# deploy-smoke-test-plain-compose and pushes them to this project's GitLab
# Container Registry, which must be enabled for CI_REGISTRY_* to be
# populated. Does not build anything itself.
push-images:
  stage: push
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs:
    - deploy-smoke-test-plain-compose
  # Runs automatically on the default branch; on any other branch it still
  # shows up in the pipeline, just as a manual job, so it can be triggered
  # on purpose (e.g. to test this job itself) without pushing to every image
  # tag on every feature-branch pipeline.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker load -i images.tar
    - |
      for svc in caddy postgres rdmo; do
        docker tag "rdmo-${svc}" "$CI_REGISTRY_IMAGE/${svc}:$CI_COMMIT_SHORT_SHA"
        docker tag "rdmo-${svc}" "$CI_REGISTRY_IMAGE/${svc}:latest"
        docker push "$CI_REGISTRY_IMAGE/${svc}:$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE/${svc}:latest"
      done
